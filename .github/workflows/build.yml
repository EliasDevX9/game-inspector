name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zip

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package .levipack
        run: |
          mkdir -p dist/game_inspector
          cp manifest.json dist/game_inspector/
          cp build/out/arm64-v8a/libgame_inspector.so dist/game_inspector/
          (cd dist/game_inspector && zip -r ../game_inspector.levipack .)

      - uses: actions/upload-artifact@v4
        with:
          name: game_inspector
          path: |
            dist/game_inspector.levipack
            dist/game_inspector/
